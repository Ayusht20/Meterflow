<!DOCTYPE html>
<html>
<head>
    <title>Signup - MeterFlow</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dashboard-bg">

<div class="auth-wrapper">

    <div class="auth-card-premium">
        <h2>Create Account 🚀</h2>
        <p class="subtitle">Start your API journey</p>

        <input id="s_email" placeholder="Email">
        <input id="s_pass" type="password" placeholder="Password">

        <button onclick="signup()">Signup</button>

        <p>Already have an account?
            <a href="/static/login.html">Login</a>
        </p>

        <p id="msg"></p>
    </div>

</div>

<script src="/static/js/app.js"></script>
</body>
</html>
